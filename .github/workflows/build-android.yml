name: Build Android

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "eas.json build profile"
        required: true
        default: preview
        type: choice
        options: [development, preview, production]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install deps
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Decode keystore + write credentials.json
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android-release.jks
          cat > credentials.json <<EOF
          {
            "android": {
              "keystore": {
                "keystorePath": "android-release.jks",
                "keystorePassword": "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}",
                "keyAlias": "${{ secrets.ANDROID_KEY_ALIAS }}",
                "keyPassword": "${{ secrets.ANDROID_KEY_PASSWORD }}"
              }
            }
          }
          EOF

      - name: Local EAS build (no cloud quota)
        env:
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
        run: |
          eas build --local \
            --platform android \
            --profile ${{ github.event.inputs.profile }} \
            --non-interactive \
            --output ./build-android.aab

      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: ui/build-android.aab
