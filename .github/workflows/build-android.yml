name: Build Android

on:
  workflow_dispatch:
    inputs:
      buildType:
        description: "apk (sideload/internal) or aab (Play Store)"
        required: true
        default: apk
        type: choice
        options: [apk, aab]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
      # See build-ios.yml: no Sentry upload creds in CI yet.
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
    steps:
      - uses: actions/checkout@v4

      # Without this app.config.js falls back to versionCode 1 on every build,
      # so sideloaded APKs are indistinguishable and Play would reject the
      # second upload. Offset by 1000 to match build-ios.yml and to clear any
      # versionCode the old EAS pipeline may have shipped. Computed in shell
      # because GitHub Actions expressions have no arithmetic operators.
      - name: Compute build number
        run: echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 1000))" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install deps
        run: npm ci

      - name: Prebuild native android project
        run: npx expo prebuild --platform android --no-install

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      # TEMP — for quick-wins.md 1.2 (Android App Links assetlinks.json). Run this
      # workflow once, copy the SHA256 line from this step's log into
      # website/.well-known/assetlinks.json, then delete this step.
      - name: Print release SHA256 fingerprint
        run: keytool -list -v -keystore android/app/release.keystore -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" | grep SHA256

      - name: Build release
        working-directory: ui/android
        env:
          MYAPP_UPLOAD_STORE_FILE: release.keystore
          MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ github.event.inputs.buildType }}" = "aab" ]; then
            ./gradlew bundleRelease
          else
            ./gradlew assembleRelease
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.event.inputs.buildType }}
          path: |
            ui/android/app/build/outputs/bundle/release/*.aab
            ui/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
