name: Build Android

on:
  workflow_dispatch:
    inputs:
      buildType:
        description: "apk (sideload/internal) or aab (Play Store)"
        required: true
        default: apk
        type: choice
        options: [apk, aab]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
      ANDROID_GOOGLE_MAPS_API_KEY: ${{ secrets.ANDROID_GOOGLE_MAPS_API_KEY }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
      EXPO_PUBLIC_POSTHOG_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_KEY }}
      EXPO_PUBLIC_POSTHOG_HOST: ${{ secrets.EXPO_PUBLIC_POSTHOG_HOST }}
      SENTRY_ORG: smashio
      SENTRY_PROJECT: smashio-sentry-app
    # Secrets are step-scoped, not job env (security review 2026-09-27, H7/L14).
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Without this app.config.js falls back to versionCode 1 on every build,
      # so sideloaded APKs are indistinguishable and Play would reject the
      # second upload. Offset by 1000 to match build-ios.yml and to clear any
      # versionCode the old EAS pipeline may have shipped. Computed in shell
      # because GitHub Actions expressions have no arithmetic operators.
      - name: Compute build number
        run: echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 1000))" >> "$GITHUB_ENV"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install deps
        run: npm ci

      - name: Prebuild native android project
        run: npx expo prebuild --platform android --no-install

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Build release
        working-directory: ui/android
        env:
          ORG_GRADLE_PROJECT_MYAPP_UPLOAD_STORE_FILE: release.keystore
          ORG_GRADLE_PROJECT_MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          chmod +x gradlew
          if [ "${{ github.event.inputs.buildType }}" = "aab" ]; then
            ./gradlew bundleRelease
          else
            ./gradlew assembleRelease
          fi

      # A keystore property Gradle does not pick up is silent: the release
      # buildType falls back to the debug keystore, the build goes green, and
      # Play rejects the upload with "signed in debug mode" (hit once on
      # run 34116459654's predecessor). Fail here instead of in the console.
      - name: Verify release signing certificate
        working-directory: ui/android
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.buildType }}" = "aab" ]; then
            artifact=$(ls app/build/outputs/bundle/release/*.aab | head -1)
            unzip -p "$artifact" 'META-INF/*.RSA' > /tmp/signer.rsa
            [ -s /tmp/signer.rsa ] || { echo "::error::No v1 signature block in $artifact"; exit 1; }
            certinfo=$(keytool -printcert -file /tmp/signer.rsa)
          else
            artifact=$(ls app/build/outputs/apk/release/*.apk | head -1)
            apksigner=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | tail -1)
            certinfo=$("$apksigner" verify --print-certs "$artifact")
          fi
          echo "$certinfo" | grep -iE 'owner:|subject:|SHA-?256'
          if echo "$certinfo" | grep -qi 'CN=Android Debug'; then
            echo "::error::$artifact is signed with the Android debug key. The ORG_GRADLE_PROJECT_MYAPP_UPLOAD_* properties were not applied."
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-${{ github.event.inputs.buildType }}
          path: |
            ui/android/app/build/outputs/bundle/release/*.aab
            ui/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
