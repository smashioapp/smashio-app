name: Build iOS

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "eas.json build profile"
        required: true
        default: preview
        type: choice
        options: [development, preview, production]

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ui
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Decode signing credentials + write credentials.json
        run: |
          echo "${{ secrets.IOS_DIST_CERT_BASE64 }}" | base64 -d > dist-cert.p12
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 -d > profile.mobileprovision
          cat > credentials.json <<EOF
          {
            "ios": {
              "provisioningProfilePath": "profile.mobileprovision",
              "distributionCertificate": {
                "path": "dist-cert.p12",
                "password": "${{ secrets.IOS_CERT_PASSWORD }}"
              }
            }
          }
          EOF

      - name: Local EAS build (no cloud quota)
        env:
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
        run: |
          eas build --local \
            --platform ios \
            --profile ${{ github.event.inputs.profile }} \
            --non-interactive \
            --output ./build-ios.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: ui/build-ios.ipa
