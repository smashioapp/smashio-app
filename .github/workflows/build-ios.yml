name: Build iOS

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ui
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
      # No SENTRY_ORG/PROJECT/AUTH_TOKEN in CI yet, so sentry-cli's debug-symbol
      # upload phase fails the archive. Crash reports stay unsymbolicated until
      # those secrets exist; drop this once they do.
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      KEYCHAIN_PASSWORD: temporary-ci-keychain-password
      IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      # Offset past the build numbers the old EAS pipeline already burned in
      # App Store Connect (it reached 17); Apple requires each upload to be
      # strictly higher than the last. Computed in shell because GitHub
      # Actions expressions have no arithmetic operators.
      - name: Compute build number
        run: echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 1000))" >> "$GITHUB_ENV"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Prebuild native ios project
        run: npx expo prebuild --platform ios --no-install

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ui/ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('ui/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods
        working-directory: ui/ios
        run: pod install

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ui

      - name: Import signing cert + provisioning profile
        run: |
          python3 -c "import base64,os; open('dist-cert.p12','wb').write(base64.b64decode(os.environ['IOS_DIST_CERT_BASE64']))"
          python3 -c "import base64,os; open('profile.mobileprovision','wb').write(base64.b64decode(os.environ['IOS_PROVISIONING_PROFILE_BASE64']))"
          echo "dist-cert.p12: $(wc -c < dist-cert.p12) bytes"
          echo "profile.mobileprovision: $(wc -c < profile.mobileprovision) bytes"

          curl -sSL --connect-timeout 10 --max-time 30 --retry 3 -o AppleWWDRCAG3.cer https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer

          security create-keychain -p "$KEYCHAIN_PASSWORD" ci-build.keychain
          security set-keychain-settings -lut 21600 ci-build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" ci-build.keychain
          security import AppleWWDRCAG3.cer -k ci-build.keychain -T /usr/bin/codesign
          security import dist-cert.p12 -k ci-build.keychain -P "$IOS_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s ci-build.keychain login.keychain
          security default-keychain -s ci-build.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" ci-build.keychain

          echo "--- find-identity ---"
          security find-identity -v ci-build.keychain
          echo "--- cert dates ---"
          security find-certificate -a -c "Apple Distribution" -p ci-build.keychain | openssl x509 -noout -dates -subject

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

          openssl smime -inform der -verify -noverify -in profile.mobileprovision -out profile.plist
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" profile.plist)
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Archive
        working-directory: ui/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          PROJECT_NAME=$(basename "$(ls -d *.xcodeproj | head -1)" .xcodeproj)
          echo "Workspace: $WORKSPACE, project: $PROJECT_NAME"
          xcodebuild -workspace "$WORKSPACE" -list -json > schemes.json
          cat schemes.json
          SCHEME=$(node -e "
            const s = JSON.parse(require('fs').readFileSync('schemes.json')).workspace.schemes;
            console.log(s.includes('$PROJECT_NAME') ? '$PROJECT_NAME' : s.find(x => !x.startsWith('Pods-')) || s[0]);
          ")
          echo "Selected scheme: $SCHEME"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath build/App.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="Y2DMN58XW2" \
            PROVISIONING_PROFILE="$PROFILE_UUID"

      - name: Export ipa
        working-directory: ui/ios
        run: |
          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>Y2DMN58XW2</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.smashio.app</key>
              <string>$PROFILE_UUID</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist exportOptions.plist

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ui/ios/build/export/*.ipa

      - name: Upload to TestFlight
        working-directory: ui/ios
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/ui/Gemfile
        run: |
          # Sanity-check the secret's shape without echoing it.
          case "$ASC_API_KEY_P8" in
            *"BEGIN PRIVATE KEY"*) echo "ASC key: PEM header present" ;;
            *) echo "ASC key: PEM header missing -- check ASC_API_KEY_P8 contents"; exit 1 ;;
          esac

          # fastlane's Token.from_json_file wants the key inline under "key";
          # it does not read a "key_filepath" field. Let python do the JSON
          # escaping so the PEM newlines survive.
          python3 -c "import json,os; json.dump({'key_id':os.environ['ASC_KEY_ID'],'issuer_id':os.environ['ASC_ISSUER_ID'],'key':os.environ['ASC_API_KEY_P8'],'in_house':False}, open('api_key.json','w'))"

          IPA=$(ls build/export/*.ipa | head -1)

          # App Store Connect's finalize step ("CHANGE UPLOAD STATE TO
          # COMPLETE") intermittently 500s after the ipa itself has already
          # transferred successfully. Retry the whole upload -- Apple dedupes
          # by build number/checksum, so a retry after a transfer-only
          # failure is safe.
          for attempt in 1 2 3; do
            if bundle exec fastlane pilot upload \
              --api_key_path api_key.json \
              --ipa "$IPA" \
              --skip_waiting_for_build_processing true; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "fastlane pilot upload failed after 3 attempts"
              exit 1
            fi
            echo "Upload attempt $attempt failed, retrying in 30s..."
            sleep 30
          done
