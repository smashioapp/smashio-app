name: OTA Update

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - "!ui/ios/**"
      - "!ui/android/**"
      - "!ui/.maestro/**"
      - "!ui/scripts/e2e.sh"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # A GitHub Environment so a required reviewer can gate every OTA (Settings > Environments >
    # ota > Required reviewers). Anything published here reaches every installed app on next
    # launch (security review 2026-09-27, M12).
    environment: ota
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Check expo-modules-jsi pin matches expo-modules-core
        run: node scripts/check-jsi-pin.js

      # Same gates as CI, so a push that breaks types or tests never ships over the air.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Copy check
        run: node scripts/check-copy.js

      - name: Unit tests
        run: npm test -- --ci

      - name: Publish EAS Update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_PUBLIC_POSTHOG_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ secrets.EXPO_PUBLIC_POSTHOG_HOST }}
          EXPO_PUBLIC_UPDATE_CHANNEL: production
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: npx eas-cli@24.8.0 update --branch production --message "${COMMIT_MESSAGE%%$'\n'*}" --non-interactive
