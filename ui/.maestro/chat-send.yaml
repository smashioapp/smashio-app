appId: com.smashio.app
---
# Covers: chat thread list renders with fixture data, opening a thread + Realtime send
# works. Fixture guarantees the test user has an approved-member thread with seeded
# history (supabase/seed.sql §E2E fixture, game …03), so this no longer needs a
# "list is non-empty" guard.
- runFlow: login.yaml
- tapOn:
    id: "tab-chat"
- assertVisible: "Chat"
- tapOn:
    id: "chat-thread-44444444-0000-0000-0000-000000000003"
- tapOn:
    id: "chat-composer-input"
- inputText: "Maestro e2e test message"
- tapOn:
    id: "chat-composer-send"
- extendedWaitUntil:
    visible: "Maestro e2e test message"
    timeout: 10000
