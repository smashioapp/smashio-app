appId: com.smashio.app
---
# A5: wrong password on the typed sign-in form → inline error, stays on the form, no
# crash. Mirrors login-form.yaml up to submit.
- launchApp:
    clearState: true
    permissions:
      all: allow
- stopApp
- openLink: "smashio://?e2e_manual_login=1"
- extendedWaitUntil:
    visible: "Get Started"
    timeout: 45000
- tapOn:
    id: "onboarding-get-started"
- extendedWaitUntil:
    visible: "Sign in to Smashio"
    timeout: 15000
- tapOn:
    id: "login-email"
- inputText: "test@smashio.dev"
- tapOn:
    id: "login-password"
- inputText: "wrong-password"
- hideKeyboard
- tapOn:
    id: "login-continue"
- extendedWaitUntil:
    visible: "Sign in to Smashio"
    timeout: 15000
- assertNotVisible: "Discover"
