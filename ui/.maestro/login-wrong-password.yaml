appId: com.smashio.app
---
# A5: wrong password on the typed sign-in form → inline error, stays on the form, no
# crash. Mirrors login-form.yaml up to submit.
- launchApp:
    clearState: true
    permissions:
      all: allow
- stopApp
- openLink: "smashio://?e2e_manual_login=1"
- extendedWaitUntil:
    visible: "Continue with email"
    timeout: 45000
- tapOn:
    id: "auth-email-disclosure"
- extendedWaitUntil:
    id: "login-email"
    timeout: 15000
- tapOn:
    id: "login-email"
- inputText: "test@smashio.dev"
- tapOn:
    id: "login-password"
- inputText: "wrong-password"
- hideKeyboard
- tapOn:
    id: "login-continue"
# Stays on the expanded email form with the fields still mounted — no navigation, no crash.
- extendedWaitUntil:
    id: "login-email"
    timeout: 15000
- assertVisible:
    id: "login-continue"
- assertNotVisible: "Discover"
- assertNotVisible: "Set up your game"
