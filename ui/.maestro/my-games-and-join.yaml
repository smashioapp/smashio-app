appId: com.smashio.app
---
# Covers: My Games list renders with fixture data, opening a game detail screen works,
# join-lifecycle CTA is reachable. Fixture guarantees the test user has upcoming games
# (supabase/seed.sql §E2E fixture), so this no longer needs a "list is non-empty" guard.
- runFlow: login.yaml
- tapOn:
    id: "tab-my-games"
- assertVisible: "My Games"
- tapOn:
    id: "mygames-row-44444444-0000-0000-0000-000000000004"
- extendedWaitUntil:
    visible:
      id: "game-cta"
    timeout: 10000
- assertVisible: "Leave game"
- back
