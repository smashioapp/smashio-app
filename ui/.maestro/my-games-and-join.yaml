appId: com.smashio.app
---
# Covers: My Games list renders, opening a game detail screen works, join CTA is reachable.
- runFlow: login.yaml
# The dev-only "Open debugger to view warnings" banner (Reanimated reduced-motion warning,
# see login.yaml) can reappear over the bottom tab bar after any screen mount and blocks
# the tap below — dismiss unconditionally rather than gating on a visibility check that
# can race it.
- tapOn:
    point: "97%,92%"
    optional: true
- tapOn: "My Games"
- assertVisible: "My Games"
- runFlow:
    when:
      notVisible: "Nothing on your calendar"
    commands:
      - tapOn:
          point: "50%,30%"
      - extendedWaitUntil:
          visible: "Request to join|Request sent|Cancel game|Leave game"
          timeout: 10000
      - back
